name: Build Photo Frame Controller OS Image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # 1️⃣ Enable binfmt inside Docker daemon
      - name: Enable multi-arch binfmt
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all

      # 2️⃣ Build image
      - name: Build OS image
        working-directory: image-builder
        run: |
          chmod +x build.sh
          ./build.sh

      # 3️⃣ Upload artifact
      - name: Upload OS Image
        uses: actions/upload-artifact@v4
        with:
          name: photo-frame-controller-os-image
          path: image-builder/pi-gen/deploy/*.img
